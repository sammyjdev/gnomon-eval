name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Security lint (report mode, non-blocking)
        run: ruff check --select S --exit-zero src tests
      - name: Test (inclui smoke do gate)
        run: python -m pytest -q

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Avoids stale pip/setuptools CVEs baked into the runner's bootstrap venv.
      - name: upgrade pip and setuptools
        run: pip install --upgrade pip setuptools
      - name: install project + dev deps
        run: pip install -e ".[dev]"
      - name: run pip-audit
        run: pip-audit
