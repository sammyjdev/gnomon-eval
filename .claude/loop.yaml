# wiring
repo_slug: sammyjdev/gnomon-eval
default_branch: master
# The repo-local .venv is REQUIRED: the shared pyenv env lacks deepeval and the
# editable gnomon install (84 collection errors without it, verified 2026-07-13).
gate_cmd: ". .venv/bin/activate && ruff check src tests && ruff format --check src tests && python -m pytest -q"
setup_cmd: "python3 -m venv .venv && . .venv/bin/activate && pip install -e '.[dev]'"
labels:
  ready: agent:ready
  blocked: agent:blocked

# posture (research tool, not a shipped product)
posture: research
risk_areas:
  - judge
  - gate
  - dataset
quality_rubric:
  testability: true
  scalability: false
  progression: true
