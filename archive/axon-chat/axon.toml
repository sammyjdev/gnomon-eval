# AXON Evaluation Configuration
#
# Evaluates a personal second-brain recall system (AXON) using:
# - OpenAI-compatible endpoint at http://localhost:8765/v1
# - Local Ollama judge (llama3) for offline evaluation ($0 cost)
#
# AXON must implement the following contract:
#   POST /v1/chat/completions
#   Request: standard OpenAI chat format
#   Response: {
#     "choices": [{"message": {"content": "<answer>"}}],
#     "usage": {"total_tokens": <N>},
#     "contexts": [<list of context strings returned for this query>]
#   }

dataset_path = "datasets/second_brain_example/cases.json"

[eval]
reproducible = true
seed = 42
judge_runs = 8
confidence_level = 0.95

[target]
kind = "openai_compat"
base_url = "http://localhost:8765/v1"
model = "axon"
contexts_field = "contexts"
timeout_s = 30.0

[judge]
provider = "ollama"
model = "llama3"
base_url = "http://localhost:11434"
timeout_s = 60.0

[gate]
faithfulness = 0.75
context_precision = 0.70
