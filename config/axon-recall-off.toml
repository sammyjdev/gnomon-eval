# AXON A/B evaluation - recall OFF arm (baseline: raw query, no retrieval).
# No [gate] thresholds: this arm is a measurement baseline, never a CI gate,
# and context metrics are meaningless without retrieved contexts.

dataset_path = "datasets/second_brain/cases.json"

[eval]
reproducible = true
seed = 42
judge_runs = 8
confidence_level = 0.95

[target]
kind = "openai_compat"
base_url = "http://localhost:8765/v1"
model = "axon"
contexts_field = "contexts"
timeout_s = 30.0
include_context = false

[judge]
# ponytail: judge swapped to DeepInfra-hosted Llama-3.1-8B-Instruct (same
# weights as the local llama3.1:8b) because the desktop Ollama host was
# offline; revert base_url/provider back to ollama once it's back if local
# judge comparability is needed again.
provider = "openai_compat"
model = "meta-llama/Meta-Llama-3.1-8B-Instruct"
base_url = "https://api.deepinfra.com/v1/openai"
api_key_env = "DEEPINFRA_API_KEY"
timeout_s = 60.0

[gate]
