dataset_path = "datasets/lina_chateval/cases.json"

[target]
script_path = "gateway/scripts/run_chateval_case.py"
cwd = "${CHATEVAL_TARGET_CWD:-.}"

[judge]
# NIM removed 2026-07-09: shares its free-tier quota with AXON's own
# NIM-backed ADR classifier on this machine (AXON_ADR_MODEL points at the
# exact same nvidia_nim/meta/llama-3.3-70b-instruct model, same account) --
# every 429/timeout observed in the 2026-07-09 Tier 2 rerun traces back to
# that contention, not to gnomon-eval's own config. DeepInfra is now
# primary: paid, private account, cheapest of the 4 providers evaluated
# (Bedrock/Together/Fireworks/DeepInfra), highest effective throughput
# ceiling (200 concurrent requests vs Fireworks' fixed 6k RPM).
primary_model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
secondary_model = "llama-3.3-70b-versatile"
tertiary_model = "gpt-oss-120b"
fallback_model = "phi4:14b"
fallback_base_url = "http://localhost:11434"

[gate]
# Recalibrated 2026-07-08 (dec-622/625 in lina's AXON project) from a
# measured, statistically trustworthy baseline (206-case suite,
# tool_selection_accuracy N=206, tone_brand/hallucination N=100 each) --
# the previous 0.90/0.80/0.90 values were unvalidated placeholders from
# the commit that first wired up this CLI. Formula (per deep-research
# synthesis, PERPLEXITY_GATE_CALIBRATION_PROMPT.md):
#   threshold = max(absolute_floor, current_mean - allowed_drop)
# Baseline means: tool_selection_accuracy=0.786, tone_brand=0.722,
# hallucination=0.697.
tool_selection_accuracy = 0.756  # max(0.72, 0.786 - 0.03)
tone_brand = 0.672               # max(0.65, 0.722 - 0.05)
hallucination = 0.70             # max(0.70, 0.697 - 0.02) -- current mean
                                  # fails this by 0.003; intentional, flags
                                  # a real gap rather than hiding it behind
                                  # a lowered floor.
