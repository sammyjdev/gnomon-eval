[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnomon-eval"
version = "0.1.0"
description = "Honest RAG evaluation harness: judge metrics with confidence intervals, cost and latency first-class, offline-first."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "deepeval>=2.0",
    "litellm>=1.40",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0",
    "pytest>=8.0",
    "ruff>=0.4",
    "pip-audit>=2.7.0",
]

[project.scripts]
gnomon = "gnomon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gnomon"]

[tool.hatch.build.targets.sdist]
# Package sources only: the repo also holds private eval datasets
# (datasets/second_brain is verbatim owner-vault content) and local
# agent/session state that must never ship to PyPI.
only-include = ["src/gnomon", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
